      <div class="main">
        <header class="topbar">

              class="icon-btn sider-toggle"
              id="siderToggle"
              aria-label="打开导航"
              aria-expanded="false"
              aria-controls="sider"

          </div>

          <div class="topbar-right">

              <span>原型视角</span>
              <div class="select-wrap">

                <svg class="icon icon--sm" aria-hidden="true">
                  <use href="#icon-chevron-down" />
                </svg>
              </div>
            </div>

            <div class="dropdown" data-dropdown>
              <button
                type="button"
                class="icon-btn"
                id="noticeBtn"
                data-dd-trigger
                aria-label="通知，3 条未读"
                aria-expanded="false"
                aria-haspopup="true"
              >
                <svg class="icon" aria-hidden="true"><use href="#icon-bell" /></svg>
                <span class="badge">3</span>
              </button>
              <div
                class="dropdown-panel dropdown-panel--wide"
                id="noticePanel"
                role="dialog"
                aria-label="通知列表"
                hidden
              >
                <div class="dropdown-title">
                  <span>通知</span>
                  <span id="noticeCount">3 条未读</span>
                </div>
                <div class="notice-item">
                  <svg class="icon" aria-hidden="true"><use href="#icon-send" /></svg>
                  <div>
                    <strong>2 个移交批次待审核</strong>
                    <span>示例市大数据管理局 · 10 分钟前</span>
                  </div>
                </div>
                <div class="notice-item">
                  <svg class="icon" aria-hidden="true">
                    <use href="#icon-alert-triangle" />
                  </svg>
                  <div>
                    <strong>1 个批次四性检测未通过</strong>
                    <span>市生态环境局 · 2 小时前</span>
                  </div>
                </div>
                <div class="notice-item">
                  <svg class="icon" aria-hidden="true"><use href="#icon-database" /></svg>
                  <div>
                    <strong>档案存储空间使用率 82%</strong>
                    <span>系统提醒 · 今天 08:00</span>
                  </div>
                </div>
                <div class="dropdown-divider"></div>
                <button type="button" class="dropdown-item" id="noticeAll">
                  <svg class="icon" aria-hidden="true"><use href="#icon-check" /></svg>
                  全部标记为已读
                </button>
              </div>
            </div>

            <div class="dropdown" data-dropdown>
              <button
                type="button"
                class="user-trigger"
                id="userBtn"
                data-dd-trigger
                aria-label="账号菜单"
                aria-expanded="false"
                aria-haspopup="true"
              >
                <span class="avatar" id="userAvatar">张</span>
                <span class="user-meta">
                  <strong id="userName">张明</strong>
                  <small id="userOrg">示例市国家综合档案馆</small>
                </span>
                <svg class="icon icon--sm" aria-hidden="true">
                  <use href="#icon-chevron-down" />
                </svg>
              </button>
              <div class="dropdown-panel" id="userPanel" role="dialog" aria-label="账号信息" hidden>
                <div class="user-card">
                  <span class="avatar" id="panelAvatar">张</span>
                  <span class="user-meta">
                    <strong id="panelName">张明</strong>
                    <small id="panelOrg">示例市国家综合档案馆</small>
                  </span>
                </div>
                <div class="dropdown-divider"></div>
                <div class="dropdown-title"><span>当前角色</span></div>
                <p class="panel-role" id="panelRole">档案馆工作人员 · 全部网站</p>
                <div class="dropdown-divider"></div>
                <button
                  type="button"
                  class="dropdown-item"
                  aria-disabled="true"
                  disabled
                >
                  <svg class="icon" aria-hidden="true"><use href="#icon-user" /></svg>
                  个人信息（原型未实现）
                </button>
                <button type="button" class="dropdown-item" id="logoutBtn">
                  <svg class="icon" aria-hidden="true"><use href="#icon-log-out" /></svg>
                  退出登录
                </button>
              </div>
            </div>
          </div>
